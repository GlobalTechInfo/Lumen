name: Release

# Builds and releases a signed APK for every pushed tag.
#
#   v1.2.3        -> stable release   (versionCode 1, versionName "1.2.3")
#   v1.2.3-beta.1 -> prerelease       (versionCode 1, versionName "1.2.3-beta.1")
#   v1.2.3-alpha.1, v1.2.3-rc.1 ...   (any -alpha/-beta/-rc suffix is a prerelease)
#
# Signing secrets (must exist in the repository):
#   KEYSTORE_BASE64   base64 of keystore.jks
#   KEYSTORE_PASSWORD keystore password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Parse tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add the base64-encoded keystore.jks to the repository secrets to build a signed release."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::Secrets KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD are required to sign the release."
            exit 1
          fi
          ./gradlew :app:assembleRelease --console=plain \
            -PversionCode=1 \
            -PversionName="${{ steps.tag.outputs.version }}"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in ANDROID_HOME, skipping verification"
          else
            "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk
          fi

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk "Lumen-${{ steps.tag.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-${{ steps.tag.outputs.version }}.apk
          path: Lumen-${{ steps.tag.outputs.version }}.apk
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAG=""
          if [ "${{ steps.tag.outputs.prerelease }}" = "true" ]; then
            FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            "Lumen-${{ steps.tag.outputs.version }}.apk" \
            --title "Lumen ${{ steps.tag.outputs.version }}" \
            --generate-notes \
            $FLAG
